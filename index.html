<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Homestretch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E8EEEB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1513" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Homestretch</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout idea: a running-track week strip (seven numbered lanes) leads every screen; everything else stays quiet. */
  --bg: #E8EEEB;
  --surface: #FAFCFB;
  --ink: #12201C;
  --muted: #55675F;
  --line: #C9D5D0;
  --soft: #DCE5E1;
  --accent: #C4381E;
  --accent-ink: #FFFFFF;
  --good: #1B7A52;
  --warn: #9A5B00;
  --display: "Big Shoulders Display", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1513; --surface: #16211E; --ink: #E7EFEB; --muted: #94A7A0; --line: #2A3A35; --soft: #1F2E2A;
    --accent: #FF6A4C; --accent-ink: #1B0A06; --good: #52C990; --warn: #E8A84A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1513; --surface: #16211E; --ink: #E7EFEB; --muted: #94A7A0; --line: #2A3A35; --soft: #1F2E2A;
  --accent: #FF6A4C; --accent-ink: #1B0A06; --good: #52C990; --warn: #E8A84A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45;
  display: flex; flex-direction: column; -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
.num, .disp { font-family: var(--display); font-variant-numeric: tabular-nums; letter-spacing: .01em; }

/* Shell */
#main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.view { max-width: 760px; margin: 0 auto; padding: 20px 16px 28px; display: flex; flex-direction: column; gap: 18px; }
#nav { display: flex; background: var(--surface); border-top: 1px solid var(--line); }
#nav a {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 4px 10px;
  color: var(--muted); text-decoration: none; font-size: 12px; font-weight: 600;
}
#nav a svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#nav a.on { color: var(--accent); }
#nav .brand { display: none; }
body.in-workout #nav { display: none; }
.cols { display: flex; flex-direction: column; gap: 18px; }
.cols > * { min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 18px; }
@media (min-width: 860px) {
  body { flex-direction: row-reverse; }
  #nav { flex-direction: column; width: 200px; border-top: 0; border-right: 1px solid var(--line); padding: 22px 12px; gap: 4px; }
  #nav a { flex: none; flex-direction: row; gap: 12px; padding: 10px 12px; border-radius: 10px; font-size: 15px; }
  #nav a.on { background: var(--soft); }
  #nav .brand { display: block; font-family: var(--display); font-weight: 800; font-size: 26px; text-transform: uppercase; padding: 0 12px 16px; line-height: 1; }
  .view { padding: 32px 28px 40px; }
  .view.wide { max-width: 1040px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
}

/* Type */
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.title { font-family: var(--display); font-weight: 800; text-transform: uppercase; font-size: 40px; line-height: .95; }
.h2 { font-family: var(--display); font-weight: 700; text-transform: uppercase; font-size: 24px; line-height: 1; letter-spacing: .02em; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.between { justify-content: space-between; }

/* Track lanes: the week */
.lanes { display: grid; grid-template-columns: repeat(7, 1fr); background: var(--accent); border-radius: var(--r); overflow: hidden; }
.lane {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 2px 9px;
  color: var(--accent-ink); border-left: 2px solid color-mix(in srgb, var(--accent-ink) 85%, transparent); min-width: 0;
}
.lane:first-child { border-left: 0; }
.lane .n { font-family: var(--display); font-weight: 800; font-size: 16px; line-height: 1.2; text-transform: uppercase; letter-spacing: .02em; }
.lane .d { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.lane .t { font-size: 10px; font-weight: 600; opacity: .9; height: 14px; white-space: nowrap; }
.lane.rest { background: color-mix(in srgb, var(--accent) 62%, var(--bg)); }
.lane.rest .n, .lane.rest .d { opacity: .6; }
.lane.done { background: var(--accent-ink); color: var(--accent); }
.lane.today::after { content: ""; position: absolute; left: 22%; right: 22%; bottom: 3px; height: 3px; border-radius: 2px; background: currentColor; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.flat { padding: 0; gap: 0; overflow: hidden; }
.hero { background: var(--ink); color: var(--bg); border: 0; padding: 20px; gap: 14px; }
.hero .eyebrow, .hero .muted { color: color-mix(in srgb, var(--bg) 70%, transparent); }
.hero .title { font-size: 46px; }
.note { border-left: 4px solid var(--accent); background: var(--soft); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.note.good { border-color: var(--good); }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 16px;
  border-radius: 12px; font-weight: 700; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.big { min-height: 56px; font-family: var(--display); font-size: 24px; text-transform: uppercase; letter-spacing: .04em; width: 100%; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 8px 10px; min-height: 40px; }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 14px; border-radius: 10px; }
.btn.danger { color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 38px; padding: 7px 13px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface);
  font-weight: 600; font-size: 14px; color: var(--ink);
}
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.seg button { padding: 8px 14px; font-weight: 700; font-size: 14px; min-height: 38px; color: var(--muted); }
.seg button.on { background: var(--ink); color: var(--bg); }
.tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.tag.good { background: color-mix(in srgb, var(--good) 18%, var(--surface)); color: var(--good); }
.tag.hot { background: color-mix(in srgb, var(--accent) 16%, var(--surface)); color: var(--accent); }

/* Lists */
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); text-align: left; width: 100%; min-width: 0; }
.li:first-child { border-top: 0; }
.li .lane-no { font-family: var(--display); font-weight: 800; font-size: 22px; width: 22px; text-align: center; color: var(--muted); flex: none; }
.li .nm { font-weight: 700; overflow-wrap: anywhere; }
.li .sub { font-size: 13px; color: var(--muted); }
.li .rt { margin-left: auto; text-align: right; font-size: 13px; color: var(--muted); flex: none; }
.day-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.day-head .dn { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1; min-width: 48px; text-transform: uppercase; letter-spacing: .03em; color: var(--accent); }
.day-tag { font-family: var(--display); font-weight: 800; font-size: 16px; line-height: 1; width: 40px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); flex: none; }

/* Workout */
.wk-top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 16px; border-bottom: 1px solid var(--line); }
.wk-top .in { max-width: 728px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.wk-top .ttl { font-family: var(--display); font-weight: 800; text-transform: uppercase; font-size: 22px; line-height: 1; }
.clock { font-family: var(--display); font-variant-numeric: tabular-nums; font-weight: 700; font-size: 22px; }
.exc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.exc.alldone { border-color: color-mix(in srgb, var(--good) 50%, var(--line)); }
.exc-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; width: 100%; text-align: left; }
.exc-head .lane-no { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; width: 26px; color: var(--accent); flex: none; }
.exc.alldone .lane-no { color: var(--good); }
.exc-body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.cues { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.setrow { display: grid; grid-template-columns: 34px 1fr 1fr 48px; gap: 8px; align-items: center; }
.setrow.nokg { grid-template-columns: 34px 1fr 48px; }
.setrow.timed { grid-template-columns: 34px 1fr auto 48px; }
.setrow .sn { font-family: var(--display); font-weight: 700; font-size: 20px; color: var(--muted); text-align: center; }
.field { display: flex; align-items: center; border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); min-width: 0; height: 46px; }
.field input { width: 100%; min-width: 0; border: 0; background: transparent; text-align: center; font-family: var(--display); font-weight: 700; font-size: 24px; padding: 0; height: 100%; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
.field input::-webkit-outer-spin-button, .field input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.field input:focus { outline: none; }
.field:focus-within { border-color: var(--accent); }
.field .u { font-size: 12px; font-weight: 700; color: var(--muted); padding-right: 8px; }
.field .st { width: 34px; height: 100%; font-size: 22px; font-weight: 700; color: var(--muted); flex: none; }
.check { width: 48px; height: 46px; border-radius: 10px; border: 1.5px solid var(--line); font-size: 22px; font-weight: 800; color: var(--muted); background: var(--surface); }
.check.on { background: var(--good); border-color: var(--good); color: var(--surface); }
.setrow.done .field { opacity: .6; }
.mob { display: flex; gap: 12px; align-items: flex-start; padding: 10px 16px; border-top: 1px solid var(--line); width: 100%; text-align: left; }
.mob .box { width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid var(--line); flex: none; display: grid; place-items: center; font-weight: 800; font-size: 15px; color: var(--surface); margin-top: 1px; }
.mob.on .box { background: var(--good); border-color: var(--good); }
.mob.on .nm { text-decoration: line-through; color: var(--muted); }
.phases { display: flex; gap: 3px; height: 26px; align-items: flex-end; }
.phases i { flex: 1; background: var(--soft); border-radius: 2px; height: 40%; min-width: 2px; }
.phases i.hard { background: var(--accent); height: 100%; }

/* Timer dock */
#dock { position: sticky; bottom: 0; z-index: 6; padding: 0 12px 12px; pointer-events: none; }
#dock .in {
  pointer-events: auto; max-width: 736px; margin: 0 auto; background: var(--ink); color: var(--bg); border-radius: 18px;
  padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
}
#dock.hard .in { background: var(--accent); color: var(--accent-ink); }
#dock .lbl { font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; opacity: .8; }
#dock .cue { font-size: 13px; opacity: .85; }
#dock .time { font-family: var(--display); font-weight: 800; font-size: 64px; line-height: .9; font-variant-numeric: tabular-nums; }
#dock .bar { height: 4px; border-radius: 2px; background: color-mix(in srgb, currentColor 25%, transparent); overflow: hidden; }
#dock .bar i { display: block; height: 100%; background: currentColor; width: 0; }
#dock .dbtn { min-height: 40px; padding: 6px 12px; border-radius: 10px; font-weight: 700; font-size: 14px; color: inherit; border: 1.5px solid color-mix(in srgb, currentColor 40%, transparent); }

/* Forms */
label.f { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 700; color: var(--muted); min-width: 0; }
.inp { border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); padding: 10px 12px; min-height: 44px; width: 100%; color: var(--ink); font-weight: 500; }
textarea.inp { min-height: 130px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; min-width: 0; }
.tile .v { font-family: var(--display); font-weight: 800; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.tile .k { font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 4px; }
.err { color: var(--accent); font-size: 14px; font-weight: 600; }
svg.chart { width: 100%; height: auto; display: block; }
svg.chart text { font-family: var(--body); font-size: 11px; fill: var(--muted); }

/* Sheet */
#sheet { position: fixed; inset: 0; z-index: 20; display: none; align-items: flex-end; justify-content: center; background: rgba(8, 14, 12, .5); }
#sheet.open { display: flex; }
#sheet .panel {
  background: var(--surface); width: 100%; max-width: 560px; max-height: 88%; overflow-y: auto; border-radius: 20px 20px 0 0;
  padding: 20px 16px 22px; display: flex; flex-direction: column; gap: 14px;
}
@media (min-width: 620px) { #sheet { align-items: center; } #sheet .panel { border-radius: 20px; padding: 24px; } }
#toast {
  position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 30; background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; display: none; max-width: 90%; text-align: center;
}
#toast.show { display: block; }
@media (prefers-reduced-motion: no-preference) {
  .btn, .chip, .check, .lane { transition: background-color .15s, color .15s, border-color .15s; }
  #sheet.open .panel { animation: up .2s ease-out; }
  @keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
}
.wk { min-height: 100%; display: flex; flex-direction: column; }
.wk > .view { flex: 1; width: 100%; }
.prog { display: flex; gap: 4px; }
.prog i { flex: 1; min-width: 2px; height: 10px; border-radius: 3px; background: var(--soft); }
.prog i.done { background: var(--good); }
.prog i.now { background: var(--accent); }

/* hosted build: keep clear of the iPhone home indicator */
#nav { padding-bottom: env(safe-area-inset-bottom); }
body.in-workout #dock { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
</style>
</head>

<main id="main"></main>

<div id="sheet"></div>
<div id="toast" role="status"></div>
<script>
/* ---------- Equipment, exercise library, mobility ---------- */
const EQUIP = [
  { k: 'kb', name: 'Kettlebell' },
  { k: 'db', name: 'Dumbbells' },
  { k: 'bb', name: 'Barbell and plates' },
  { k: 'bench', name: 'Bench' },
  { k: 'pullup', name: 'Pull-up bar' },
  { k: 'bands', name: 'Resistance bands' },
  { k: 'cable', name: 'Cable machine / lat pulldown' },
  { k: 'machines', name: 'Leg and chest machines' },
  { k: 'bike', name: 'Stationary bike' },
  { k: 'treadmill', name: 'Treadmill' },
  { k: 'rower', name: 'Rowing machine' },
  { k: 'rope', name: 'Jump rope' }
];
const CARDIO_ON = {
  bike: 'Stationary bike', rower: 'Rowing machine', treadmill: 'Treadmill', outside: 'Outside (walk or run)'
};
const PAT_NAME = {
  squat: 'Squat', hinge: 'Hip hinge', lunge: 'Single leg', glute: 'Glutes', abduct: 'Outer hips',
  push: 'Chest push', press: 'Shoulder press', pull: 'Row', pulldown: 'Lats', upperback: 'Upper back',
  backext: 'Lower back', core_front: 'Core, front', core_side: 'Core, sides', cond: 'Conditioning',
  biceps: 'Biceps', triceps: 'Triceps'
};
const COMPOUND = ['squat', 'hinge', 'lunge', 'push', 'press', 'pull', 'pulldown'];

const EX = {};
/* id, name, pattern(s), equipment needed, level 1-3, mode (reps|side|time|tside), load (bw|kb|db|bb|mc|band),
   muscles, range (reps or seconds), cues, harder variation */
function E(id, name, pat, eq, lvl, mode, load, mus, r, cues, next) {
  EX[id] = { id, name, pat: [].concat(pat), eq, lvl, mode, load, mus, r, cues, next: next || null };
}

/* Squat */
E('kb_goblet_squat', 'Goblet Squat', 'squat', ['kb'], 1, 'reps', 'kb', 'Quads, glutes, core', [10, 15], [
  'Hold the kettlebell by the horns against your chest, feet a little wider than your hips.',
  'Sit down between your heels with your chest tall and knees tracking over your toes.',
  'Push the floor away through your whole foot to stand.'], 'kb_pause_squat');
E('db_goblet_squat', 'Dumbbell Goblet Squat', 'squat', ['db'], 1, 'reps', 'db', 'Quads, glutes, core', [10, 15], [
  'Hold one dumbbell upright against your chest, feet a little wider than your hips.',
  'Sit down between your heels with your chest tall.',
  'Stand up by pushing through your whole foot.'], 'bb_back_squat');
E('leg_press', 'Leg Press', 'squat', ['machines'], 1, 'reps', 'mc', 'Quads, glutes', [10, 15], [
  'Feet shoulder-width in the middle of the platform, lower back flat against the pad.',
  'Lower until your knees are at about 90 degrees.',
  'Press up without locking your knees hard.']);
E('bb_back_squat', 'Barbell Back Squat', 'squat', ['bb'], 2, 'reps', 'bb', 'Quads, glutes, core', [6, 10], [
  'Bar on your upper back, hands just outside your shoulders, brace your stomach.',
  'Sit down and back until your thighs are about parallel to the floor.',
  'Drive up, keeping your chest and hips rising together.']);
E('kb_pause_squat', 'Pause Goblet Squat', 'squat', ['kb'], 2, 'reps', 'kb', 'Quads, glutes, core', [8, 12], [
  'Do a goblet squat, then hold the bottom position for 3 seconds.',
  'Stay tight during the pause, do not relax onto your knees.',
  'Stand up without bouncing.']);
E('bw_squat', 'Bodyweight Squat', 'squat', [], 1, 'reps', 'bw', 'Quads, glutes', [12, 20], [
  'Feet a little wider than your hips, arms out in front for balance.',
  'Sit back and down as far as you can with heels on the floor.',
  'Stand tall and squeeze your glutes at the top.'], 'kb_goblet_squat');

/* Hip hinge */
E('kb_rdl', 'Kettlebell Romanian Deadlift', 'hinge', ['kb'], 1, 'reps', 'kb', 'Hamstrings, glutes, lower back', [12, 15], [
  'Hold the kettlebell with both hands in front of your thighs, knees soft.',
  'Push your hips back with a flat back until you feel your hamstrings stretch.',
  'Lower for 3 seconds, then stand up by squeezing your glutes.'], 'kb_sl_rdl');
E('db_rdl', 'Dumbbell Romanian Deadlift', 'hinge', ['db'], 1, 'reps', 'db', 'Hamstrings, glutes, lower back', [10, 12], [

      h('div', { class: 'grow' }, h('div', { class: 'ttl' }, d.title), h('div', { class: 'small muted' }, d.sub || '')),
      h('span', { class: 'clock', id: 'wk-clock' }, fmtClock((Date.now() - d.startedAt) / 1000)),
      h('button', { class: 'btn primary sm', onclick: finishSheet }, 'Finish'))));
    const v = h('div', { class: 'view' });
    if (d.ease) v.append(h('div', { class: 'note' }, h('b', null, 'Week 1 is an ease-in week. '), 'One set fewer per exercise so the first sessions do not leave you too sore to continue.'));
    v.append(mobCard('Warm-up', d.warm) || '');
    d.items.forEach((it, i) => v.append(it.k === 'cardio' ? cardioCard(it, i) : exCard(it, i)));
    v.append(h('button', { class: 'btn', onclick: () => pickSheet('Add an exercise', allOptions(), id => {
      const it = exItem(S.plan, { ex: id, sets: 3, reps: EX[id].r.slice(), rest: 60 }, S.hist, place(), false);
      it.bi = null; d.items.push(it); d.open = d.items.length - 1; persist(); render();
    }, 'Added to this workout only.') }, '+ Add exercise'));
    v.append(mobCard('Cool-down stretches', d.cool) || '');
    v.append(h('button', { class: 'btn primary big', onclick: finishSheet }, 'Finish workout'));
    wrap.append(v, h('div', { id: 'dock' }));
    return wrap;
  }

  /* ---------- Progress ---------- */
  function lineChart(pts, unit) {
    const W = 340, H = 150, L = 34, R = 14, Tp = 12, B = 22;
    const ys = pts.map(p => p.y), xs = pts.map(p => p.x);
    let lo = Math.min(...ys), hi = Math.max(...ys);
    if (hi - lo < 1) { hi += 1; lo -= 1; }
    const pad = (hi - lo) * 0.12; lo -= pad; hi += pad;
    const x0 = Math.min(...xs), x1 = Math.max(...xs);
    const X = x => L + (x1 === x0 ? 0.5 : (x - x0) / (x1 - x0)) * (W - L - R);
    const Y = y => Tp + (1 - (y - lo) / (hi - lo)) * (H - Tp - B);
    const path = pts.map((p, i) => (i ? 'L' : 'M') + X(p.x).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
    const last = pts[pts.length - 1];
    const grid = [0, 0.5, 1].map(f => { const yv = lo + (hi - lo) * f, y = Y(yv).toFixed(1); return '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '" stroke="var(--line)" stroke-width="1"/><text x="' + (L - 6) + '" y="' + y + '" text-anchor="end" dominant-baseline="middle">' + (Math.round(yv * 10) / 10) + '</text>'; }).join('');
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Line chart, latest value ' + last.y + ' ' + unit + '">' + grid +
      '<path d="' + path + ' L' + X(last.x).toFixed(1) + ' ' + (H - B) + ' L' + X(pts[0].x).toFixed(1) + ' ' + (H - B) + ' Z" fill="var(--accent)" opacity=".12"/>' +
      '<path d="' + path + '" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<circle cx="' + X(last.x).toFixed(1) + '" cy="' + Y(last.y).toFixed(1) + '" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>' +
      '<text x="' + L + '" y="' + (H - 6) + '">' + fmtDate(pts[0].x) + '</text><text x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end">' + fmtDate(last.x) + '</text></svg>';
  }
  function weekBars() {
    const W = 340, H = 130, B = 22, Tp = 14, n = 8, ws = weekStart(Date.now());
    const counts = [];
    for (let i = n - 1; i >= 0; i--) { const a = new Date(ws); a.setDate(a.getDate() - 7 * i); const s = weekStart(a.getTime()); const e = new Date(s); e.setDate(e.getDate() + 7); counts.push({ s, c: Object.values(S.hist).filter(x => x.date >= s && x.date < e.getTime()).length }); }
    const max = Math.max(S.plan.days.length, ...counts.map(c => c.c), 1);
    const bw = (W - 8) / n;
    const ty = (Tp + (1 - S.plan.days.length / max) * (H - Tp - B)).toFixed(1);
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Workouts per week for the last 8 weeks">' +
      '<line x1="0" x2="' + W + '" y1="' + ty + '" y2="' + ty + '" stroke="var(--muted)" stroke-dasharray="3 4" stroke-width="1"/>' +
      '<text x="' + W + '" y="' + (ty - 4) + '" text-anchor="end">plan: ' + S.plan.days.length + ' a week</text>' +
      counts.map((c, i) => {
        const hh = (c.c / max) * (H - Tp - B), x = 4 + i * bw + 5, y = H - B - hh;
        return '<rect x="' + x.toFixed(1) + '" y="' + (c.c ? y.toFixed(1) : H - B - 2) + '" width="' + (bw - 10).toFixed(1) + '" height="' + (c.c ? hh.toFixed(1) : 2) + '" rx="4" fill="' + (i === n - 1 ? 'var(--accent)' : 'var(--muted)') + '" opacity="' + (i === n - 1 ? 1 : 0.55) + '"/>' +
          (c.c ? '<text x="' + (x + (bw - 10) / 2).toFixed(1) + '" y="' + (y - 4).toFixed(1) + '" text-anchor="middle">' + c.c + '</text>' : '') +
          '<text x="' + (x + (bw - 10) / 2).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + fmtDate(c.s) + '</text>';
      }).join('') + '</svg>';
  }
  const METRICS = { kg: ['Weight', 'kg'], waist: ['Waist', 'cm'], hips: ['Hips', 'cm'], thigh: ['Thigh', 'cm'] };
  let metric = 'kg';
  function histSheet(s) {
    openSheet(h('div', null, h('div', { class: 'eyebrow' }, DOW_LONG[todayDow(s.date)] + ' ' + fmtDate(s.date) + ' · ' + s.mins + ' min'), h('h2', { class: 'h2' }, s.title)),
      s.feel ? h('div', null, h('span', { class: 'tag' }, ['Too easy', 'Good', 'Hard', 'Too much'][s.feel - 1])) : null,
      s.note ? h('p', { class: 'small' }, s.note) : null,
      h('div', { class: 'card flat' }, h('div', { class: 'list' }, s.items.map(it => h('div', { class: 'li' }, h('span', { class: 'grow' },
        h('div', { class: 'nm' }, it.cardio ? cardioName(it) : it.name),
        h('div', { class: 'sub' }, it.cardio ? it.mins + ' min' + (it.km ? ' · ' + it.km + ' km' : '')
          : it.sets.map(x => x.r + (it.t ? ' s' : '')).join(', ') + (it.sets.some(x => x.kg) ? ' at ' + Math.max(...it.sets.map(x => x.kg || 0)) + ' kg' : ''))))))),
      h('div', { class: 'row' },
        h('button', { class: 'btn danger', onclick: () => confirmSheet('Delete this workout?', 'It will be removed from your history on all devices.', 'Delete', () => {
          delete S.hist[s.id]; S.deleted = (S.deleted || []).concat(s.id).slice(-2000); commit();
          pushDoc(monthKey(s.date), () => monthData(monthKey(s.date))); render();
        }) }, 'Delete'),
        h('button', { class: 'btn primary grow', onclick: closeSheet }, 'Close')));
  }
  function vProgress() {
    const v = h('div', { class: 'view wide' }), wi = weekInfo();
    const all = Object.values(S.hist).sort((a, b) => b.date - a.date);
    const ms = new Date(); ms.setDate(1); ms.setHours(0, 0, 0, 0);
    const month = all.filter(s => s.date >= ms.getTime());
    v.append(h('header', null, h('div', { class: 'eyebrow' }, 'Progress'), h('h1', { class: 'title' }, all.length ? all.length + ' workout' + (all.length > 1 ? 's' : '') + ' logged' : 'Nothing logged yet')));
    v.append(h('div', { class: 'tiles' },
      h('div', { class: 'tile' }, h('div', { class: 'v' }, wi.done.size + '/' + S.plan.days.length), h('div', { class: 'k' }, 'sessions this week')),
      h('div', { class: 'tile' }, h('div', { class: 'v' }, month.length), h('div', { class: 'k' }, 'workouts this month')),
      h('div', { class: 'tile' }, h('div', { class: 'v' }, month.reduce((s, x) => s + (x.mins || 0), 0)), h('div', { class: 'k' }, 'minutes this month'))));

    const weeks = h('div', { class: 'card' }, h('h2', { class: 'h2' }, 'Workouts per week'), h('div', { html: weekBars() }));

    const pts = S.measures.filter(m => m[metric] != null).sort((a, b) => a.date - b.date).map(m => ({ x: m.date, y: m[metric] }));
    const f = { date: isoDay(Date.now()) };
    const mInput = (k, label) => h('label', { class: 'f' }, label, h('input', { class: 'inp', id: 'm-' + k, type: 'number', inputmode: 'decimal', step: 'any', oninput: e => { const x = parseFloat(e.target.value); f[k] = Number.isFinite(x) ? x : null; } }));
    const body = h('div', { class: 'card' }, h('h2', { class: 'h2' }, 'Body measurements'),
      h('p', { class: 'small muted' }, 'Optional. Once a week, same day and time, is enough. Waist and thigh show change that the scale can miss.'),
      h('div', { class: 'chips' }, Object.keys(METRICS).map(k => h('button', { class: 'chip' + (metric === k ? ' on' : ''), onclick: () => { metric = k; render(); } }, METRICS[k][0]))),
      pts.length >= 2 ? h('div', { html: lineChart(pts, METRICS[metric][1]) })
        : h('p', { class: 'small muted' }, pts.length ? 'One entry so far: ' + pts[0].y + ' ' + METRICS[metric][1] + '. The chart appears after the second.' : 'No ' + METRICS[metric][0].toLowerCase() + ' entries yet.'),
      h('div', { class: 'grid2' },
        h('label', { class: 'f' }, 'Date', h('input', { class: 'inp', id: 'm-date', type: 'date', value: f.date, onchange: e => { f.date = e.target.value; } })),
        mInput('kg', 'Weight (kg)'), mInput('waist', 'Waist (cm)'), mInput('hips', 'Hips (cm)'), mInput('thigh', 'Thigh (cm)')),
      h('button', { class: 'btn', onclick: () => {
        if (!['kg', 'waist', 'hips', 'thigh'].some(k => f[k] != null)) { toast('Enter at least one number'); return; }
        const dt = new Date(f.date + 'T12:00:00').getTime();
        S.measures.push({ id: uid(), date: Number.isFinite(dt) ? dt : Date.now(), kg: f.kg == null ? null : f.kg, waist: f.waist == null ? null : f.waist, hips: f.hips == null ? null : f.hips, thigh: f.thigh == null ? null : f.thigh });
        commit(); toast('Saved'); render();
      } }, 'Add entry'),
      S.measures.length ? h('div', { class: 'list' }, S.measures.slice().sort((a, b) => b.date - a.date).slice(0, 5).map(m => h('div', { class: 'li', style: 'padding-left:0;padding-right:0' },
        h('span', { class: 'grow' }, h('div', { class: 'nm' }, fmtDate(m.date)),
          h('div', { class: 'sub' }, Object.keys(METRICS).filter(k => m[k] != null).map(k => METRICS[k][0] + ' ' + m[k] + ' ' + METRICS[k][1]).join(' · '))),
        h('button', { class: 'btn ghost sm', 'aria-label': 'Delete entry from ' + fmtDate(m.date), onclick: () => { S.measures = S.measures.filter(x => x.id !== m.id); commit(); render(); } }, 'Delete')))) : null);

    const bests = {};
    for (const s of all) for (const it of s.items) if (it.ex) for (const x of it.sets) {
      const b = bests[it.ex];
      if (!b || (x.kg || 0) > (b.kg || 0) || ((x.kg || 0) === (b.kg || 0) && x.r > b.r)) bests[it.ex] = { name: it.name, r: x.r, kg: x.kg, t: it.t, date: s.date };
    }
    const bl = Object.values(bests).sort((a, b) => a.name.localeCompare(b.name));
    const hist = h('div', { class: 'card flat' }, h('div', { class: 'day-head' }, h('h2', { class: 'h2' }, 'History')),
      h('div', { class: 'list' }, all.length ? all.slice(0, 40).map(s => h('button', { class: 'li', onclick: () => histSheet(s) },
        h('span', { class: 'grow' }, h('div', { class: 'nm' }, s.title), h('div', { class: 'sub' }, DOW[todayDow(s.date)] + ' ' + fmtDate(s.date) + ' · ' + s.mins + ' min')),
        h('span', { class: 'rt' }, s.items.length + ' block' + (s.items.length === 1 ? '' : 's'))))
        : h('div', { class: 'li muted' }, 'Finish your first workout and it shows up here.')));
    const best = bl.length ? h('div', { class: 'card flat' }, h('div', { class: 'day-head' }, h('h2', { class: 'h2' }, 'Best sets')),
      h('div', { class: 'list' }, bl.map(b => h('div', { class: 'li' }, h('span', { class: 'grow' }, h('div', { class: 'nm' }, b.name), h('div', { class: 'sub' }, fmtDate(b.date))),
        h('span', { class: 'rt' }, h('b', null, b.r + (b.t ? ' s' : ' reps') + (b.kg ? ' at ' + b.kg + ' kg' : ''))))))) : null;
    v.append(h('div', { class: 'cols' }, h('div', { class: 'stack' }, weeks, body), h('div', { class: 'stack' }, hist, best)));
    return v;
  }

  /* ---------- Setup ---------- */
  function multi(arr, key) { const i = arr.indexOf(key); if (i >= 0) arr.splice(i, 1); else arr.push(key); }
  function vSetup() {
    const p = S.profile, pl = place(), v = h('div', { class: 'view wide' });
    const chip = (label, on, fn) => h('button', { class: 'chip' + (on ? ' on' : ''), 'aria-pressed': on ? 'true' : 'false', onclick: () => { fn(); commit(); render(); } }, label);
    v.append(h('header', null, h('div', { class: 'eyebrow' }, 'Setup'), h('h1', { class: 'title' }, 'Your training profile')));
    const left = h('div', { class: 'stack' },
      h('div', { class: 'card' }, h('h2', { class: 'h2' }, 'Goals'),
        h('div', { class: 'chips' }, Object.keys(GOALS).map(k => chip(GOALS[k], p.goals.includes(k), () => { multi(p.goals, k); if (!p.goals.length) p.goals.push(k); })))),
      h('div', { class: 'card' }, h('h2', { class: 'h2' }, 'Level'),
        h('div', { class: 'chips' }, [1, 2, 3].map(k => chip(LEVELS[k], p.level === k, () => { p.level = k; })))),
      h('div', { class: 'card' }, h('h2', { class: 'h2' }, 'Training days'),
        h('div', { class: 'chips' }, DOW.map((d, i) => chip(d, p.days.includes(i), () => { multi(p.days, i); if (!p.days.length) p.days.push(i); }))),
        h('div', { class: 'f' }, 'Session length'),
        h('div', { class: 'chips' }, [30, 40, 50, 60].map(m => chip(m + ' min', p.minutes === m, () => { p.minutes = m; })))),
      h('div', { class: 'card' }, h('h2', { class: 'h2' }, 'Focus areas'),
        h('p', { class: 'small muted' }, 'These get extra exercises. Every plan still trains the whole body.'),
        h('div', { class: 'chips' }, Object.keys(FOCUS).map(k => chip(FOCUS[k].name, p.focus.includes(k), () => multi(p.focus, k))))));
    const right = h('div', { class: 'stack' },
      h('div', { class: 'card' }, h('div', { class: 'row between wrap' }, h('h2', { class: 'h2' }, 'Equipment'), placeSeg(render)),
        h('p', { class: 'small muted' }, 'Pick what you have at ' + pl.name + '. Bodyweight exercises are always available.'),
        h('div', { class: 'chips' }, EQUIP.map(e => chip(e.name, pl.eq.includes(e.k), () => multi(pl.eq, e.k)))),
        h('div', { class: 'grid2' },
          pl.eq.includes('kb') ? numField('Kettlebell weight (kg)', 'eq-kb', pl.kbKg, x => { const n = parseFloat(x); pl.kbKg = Number.isFinite(n) ? n : null; commit(); }, { inputmode: 'decimal', step: 'any' }) : null,
          pl.eq.includes('db') ? numField('Dumbbell starting weight (kg)', 'eq-db', pl.dbKg, x => { const n = parseFloat(x); pl.dbKg = Number.isFinite(n) ? n : null; commit(); }, { inputmode: 'decimal', step: 'any' }) : null)),
      h('div', { class: 'card' }, h('h2', { class: 'h2' }, 'Build the plan'),
        h('p', { class: 'small muted' }, 'Changes on this page do not touch your current plan until you build a new one.'),
        h('button', { class: 'btn primary', onclick: rebuildPlan }, 'Build plan for ' + pl.name)),
      h('div', { class: 'card' }, h('h2', { class: 'h2' }, 'Timer sound'),
        h('div', { class: 'chips' }, chip('Beeps on', p.sound, () => { p.sound = true; unlockAudio(); }), chip('Silent', !p.sound, () => { p.sound = false; }))),
      h('div', { class: 'card' }, h('h2', { class: 'h2' }, 'Your data'),
        h('p', { class: 'small', id: 'sync-line' }, syncText()),
        h('div', { class: 'row wrap' },
          h('button', { class: 'btn', onclick: () => copyText(JSON.stringify({ homestretchBackup: 1, core: coreData(), hist: S.hist }), 'Backup code copied. Paste it into Notes to keep it.') }, 'Copy backup code'),
          h('button', { class: 'btn', onclick: restoreSheet }, 'Restore from backup'),
          h('button', { class: 'btn danger', onclick: () => confirmSheet('Erase everything?', 'This deletes your plan, history and measurements on all devices and starts over.', 'Erase', eraseAll) }, 'Erase everything'))));
    v.append(h('div', { class: 'cols' }, left, right));
    return v;
  }
  function restoreSheet() {
    const ta = h('textarea', { class: 'inp', id: 'restore-box', placeholder: 'Paste your backup code here' });
    const err = h('div', { class: 'err' });
    openSheet(h('h2', { class: 'h2' }, 'Restore from backup'), h('p', { class: 'small muted' }, 'This replaces the plan, history and measurements in the app with the ones in the backup.'), ta, err,
      h('div', { class: 'row' }, h('button', { class: 'btn grow', onclick: closeSheet }, 'Cancel'),
        h('button', { class: 'btn primary grow', onclick: () => {
          try {
            const o = JSON.parse(ta.value.slice(ta.value.indexOf('{'), ta.value.lastIndexOf('}') + 1));
            if (!o.homestretchBackup || !o.core || !o.core.plan) throw new Error('x');
            for (const k of CORE_KEYS) if (o.core[k] !== undefined) S[k] = o.core[k];
            S.hist = o.hist || {}; S.draft = null; commit();
            new Set(Object.values(S.hist).map(s => monthKey(s.date))).forEach(k => pushDoc(k, () => monthData(k)));
            closeSheet(); toast('Backup restored'); render();
          } catch (e) { err.textContent = 'That is not a complete backup code. Copy the whole code again.'; }
        } }, 'Restore')));
  }
  function eraseAll() {
    const ids = Object.keys(S.hist), months = new Set(Object.values(S.hist).map(s => monthKey(s.date)));
    S = defaults(); S.deleted = ids.slice(-2000);
    S.plan = buildPlan(S.profile, place(), S.active);
    stopTimer(); commit();
    months.forEach(k => pushDoc(k, () => monthData(k)));
    toast('Everything erased'); go('today');
  }

  const VIEWS = { today: vToday, plan: vPlan, progress: vProgress, setup: vSetup, workout: vWorkout };

  /* ---------- Boot ---------- */
  function start(data) {
    if (data && data.draft && !S.draft) S.draft = data.draft;
    document.addEventListener('click', () => { if (route() === 'workout') unlockAudio(); }, true);
    render();
    cloudInit();
  }
  const hot = window.claude && window.claude.hot;
  try { if (hot && hot.snapshot) hot.snapshot(() => ({ draft: S.draft })); } catch (e) { /* not in the viewer */ }
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();

</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
</script>
</body>
